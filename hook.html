<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Glow-Up Revenge · Hook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700;900&display=swap">
<style>
  /* ===== Visual system (same as the earlier hook): plum line art, cream panels, rose/amber accents ===== */
  :root {
    --ink:#2b1630; --cream:#fff6ea; --cream2:#f3e2d0;
    --rose:#e8436f; --amber:#ffb648; --lav:#c3b0ff;
    --line:5px solid var(--ink); --drop:0 8px 0 var(--ink);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html,body { margin:0; height:100%; background:#140b18; overflow:hidden;
    font-family:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; color:var(--ink); }
  #stage { position:absolute; width:720px; height:1280px; transform-origin:0 0; overflow:hidden; background:#000; }
  .outline { color:#fff; font-weight:900;
    text-shadow:3px 0 0 var(--ink),-3px 0 0 var(--ink),0 3px 0 var(--ink),0 -3px 0 var(--ink),
      2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink),0 6px 0 var(--ink); }
  .btn { border:var(--line); border-radius:999px; font:inherit; font-weight:900; cursor:pointer;
    background:linear-gradient(#ff7095, var(--rose) 55%, #d42f5c); box-shadow:inset 0 -8px 0 rgba(0,0,0,.18), inset 0 6px 0 rgba(255,255,255,.35), var(--drop);
    display:flex; align-items:center; justify-content:center; }
  @keyframes breathe { to { transform:scale(1.06); } }

  /* ---------- Layers ---------- */
  /* Background is toned down so the characters read first */
  #bg { position:absolute; inset:0; background:url(assets/bg-campus.jpg) center/cover; transition:filter .6s; filter:saturate(.6) brightness(.96) contrast(.92); }
  #bg.cold { filter:saturate(.25) brightness(.65) contrast(.9); }
  .spr { position:absolute; bottom:90px; transform-origin:50% 100%; opacity:0; pointer-events:none;
    transition:opacity .25s, left .55s cubic-bezier(.2,1,.3,1), filter .6s; filter:drop-shadow(0 10px 0 rgba(43,22,48,.18)); }
  .spr.on { opacity:1; }
  .pop { animation:pop .32s cubic-bezier(.2,1.8,.4,1); }
  @keyframes pop { 0% { transform:scale(.92,1.06); } 100% { transform:none; } }
  .prop { position:absolute; opacity:0; pointer-events:none; }
  #vig { position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity .6s;
    background:radial-gradient(circle at 30% 60%, transparent 35%, rgba(30,10,30,.75) 100%); }
  #vig.on { opacity:1; }

  /* ---------- Speech bubbles ---------- */
  .bubble { position:absolute; top:120px; max-width:520px; padding:18px 28px 20px; background:var(--cream); border:var(--line); border-radius:30px;
    box-shadow:var(--drop), 0 18px 40px rgba(0,0,0,.3); font-size:29px; font-weight:700; line-height:1.4; opacity:0; transform:scale(.6);
    transition:.22s cubic-bezier(.2,1.6,.4,1); pointer-events:none; }
  .bubble.show { opacity:1; transform:none; }
  .bubble .name { position:absolute; top:-26px; left:22px; padding:2px 18px; border:4px solid var(--ink); border-radius:999px; font-size:22px; font-weight:900; color:#fff; }
  .bubble:after { content:""; position:absolute; bottom:-24px; width:26px; height:26px; background:var(--cream);
    border-right:5px solid var(--ink); border-bottom:5px solid var(--ink); transform:rotate(45deg); }
  #bL { left:30px; transform-origin:20% 100%; } #bL:after { left:70px; } #bL .name { background:var(--lav); color:var(--ink); }
  #bR { right:30px; transform-origin:80% 100%; } #bR:after { right:70px; } #bR .name { background:var(--rose); }
  #bR.pink .name { background:#ff5fb0; }

  /* ---------- Floating fx text ---------- */
  .fxText { position:absolute; font-size:58px; letter-spacing:2px; pointer-events:none; white-space:nowrap; transform:translate(-50%,-50%); }
  #flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }
  canvas#fx { position:absolute; inset:0; width:720px; height:1280px; pointer-events:none; }

  /* ---------- Cover & end card ---------- */
  .card { position:absolute; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; padding-bottom:150px; cursor:pointer; }
  #cover { background:linear-gradient(transparent 40%, rgba(32,16,40,.92)), url(assets/bg-campus.jpg) center/cover; }
  #cover .lvl { background:var(--amber); border:var(--line); border-radius:999px; box-shadow:var(--drop); font-size:28px; padding:4px 28px; margin-bottom:18px; }
  #cover h1 { margin:0 0 54px; font-size:104px; letter-spacing:4px; }
  .card .btn { width:420px; height:106px; font-size:40px; color:#fff; animation:breathe .7s infinite alternate; }
  #end { display:none; background:linear-gradient(rgba(32,16,40,.15), rgba(32,16,40,.92) 70%); }
  #end.show { display:flex; animation:fadeIn .5s; }
  @keyframes fadeIn { from { opacity:0; } }
  #end h2 { margin:0 40px 20px; font-size:58px; text-align:center; line-height:1.3; }
  #end p { margin:0 0 50px; font-size:30px; color:#fff; font-weight:700; text-align:center; line-height:1.5; }
  #end p b { color:var(--amber); }
  #skip { position:absolute; right:22px; top:22px; z-index:9; font:inherit; font-size:22px; font-weight:700; color:#fff; background:rgba(32,16,40,.55);
    border:3px solid rgba(255,255,255,.6); border-radius:999px; padding:6px 18px; cursor:pointer; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <img class="prop" id="spill" src="assets/cookies-spilled.webp" alt="">
  <img class="spr" id="R" alt="">
  <img class="spr" id="R2" alt="">
  <img class="prop" id="box" src="assets/box-closed.webp" alt="">
  <img class="spr" id="L" alt="">
  <div id="vig"></div>
  <div class="bubble" id="bL"><span class="name">Chloe</span><span class="t"></span></div>
  <div class="bubble" id="bR"><span class="name">Ryan</span><span class="t"></span></div>
  <div id="flash"></div>
  <canvas id="fx" width="720" height="1280"></canvas>
  <button id="skip">Skip ››</button>

  <div class="card" id="cover"><div class="lvl outline">LEVEL 1</div><h1 class="outline">Glow-Up Revenge</h1><div class="btn outline">▶ PLAY</div></div>
  <div class="card" id="end">
    <h2 class="outline">Humiliated in front of everyone...</h2>
    <p>Prom is in 30 days.<br>Give Chloe a <b>total makeover</b> and make them regret it!</p>
    <div class="btn outline" id="goBtn">Help Her Glow Up</div>
  </div>
</div>

<script>
'use strict';
// ================= Layer layout (stage px) =================
// Feet sit on bottom:90px. Chloe stays on the left in front; the other side is drawn behind her.
const SPR = {
  'chloe-confess': { h: 600, left: 10 },
  'chloe-rejected': { h: 600, left: 30 },
  'chloe-empty':   { h: 600, left: 30 },
  'chloe-crying':  { h: 600, left: 30 },
  'ryan-phone':    { h: 760, left: 430 },
  'ryan-sneer':    { h: 760, left: 420 },
  'tiffany-strut': { h: 740, left: 385 },
  'couple-hug':    { h: 760, left: 205 },
  'couple-mock':   { h: 760, left: 215 },
};
// Each line is voiced by assets/sfx/v-<key>.mp3 (Breeze TTS: Chloe = voice E, Ryan = C, Tiffany = A)
const LINES = {
  'chloe-confess': "R-Ryan... I've liked you for a really long time! I baked these heart cookies myself... would you try one?",
  'ryan-reject': 'You? Ha. Have you even looked in a mirror lately?',
  'tiffany-enter': "Babe, who are you even talking to? Ew, isn't that the fat girl?",
  'tiffany-mock1': "Homemade cookies? No wonder you're so fat!",
  'ryan-mock': "Even a dog wouldn't eat this junk.",
  'tiffany-mock2': "See you at prom, piggy! Don't forget to eat up!",
  'chloe-cry': 'Why... I just... I just liked you...',
};

// ================= Setup =================
const $ = id => document.getElementById(id);
const stage = $('stage');
const Q = new URLSearchParams(location.search);
let scale = 1;
function fit() {
  scale = Math.min(innerWidth / 720, innerHeight / 1280);
  stage.style.transform = `scale(${scale})`;
  stage.style.left = (innerWidth - 720 * scale) / 2 + 'px';
  stage.style.top = (innerHeight - 1280 * scale) / 2 + 'px';
}
addEventListener('resize', fit); fit();
// Preload and decode every layer before the cover can start, so swaps never flash
const imagesReady = Promise.all([...Object.keys(SPR), 'box-closed', 'cookies-spilled'].map(k => { const i = new Image(); i.src = `assets/${k}.webp`; return i.decode().catch(() => {}); }));

// every wait in the sequence goes through here (the story plays at its own pace; taps don't hurry it)
let hurry = null, skipTyping = false;
const wait = ms => new Promise(r => { const t = setTimeout(done, Q.has('fast') ? ms / 10 : ms); function done() { clearTimeout(t); hurry = null; r(); } hurry = done; });

// ================= Audio =================
// Kenney CC0 effects (assets/sfx/LICENSE-*) plus Breeze TTS voice lines and reactions.
const AC = new (window.AudioContext || window.webkitAudioContext)();
function ac() { if (AC.state === 'suspended') AC.resume(); return AC; }
const SOUNDS = ['whoosh', 'snatch', 'blip', 'heart', 'break', 'hit', 'crash', 'thud', 'shutter', 'sting', 'tap',
  'chloe-gasp', 'chloe-sob', 'ryan-laugh', 'tiffany-laugh', ...Object.keys(LINES).map(k => 'v-' + k)];
const BUF = {};
const audioReady = Promise.all(SOUNDS.map(n => fetch(`assets/sfx/${n}.mp3`, { cache: 'no-cache' })  // revalidate so replaced takes show up without a hard refresh
  .then(r => r.arrayBuffer())
  .then(b => new Promise((ok, no) => AC.decodeAudioData(b, ok, no))).then(buf => { BUF[n] = buf; }).catch(() => {})));
// maxDur (s) fades the clip out early, for long voice takes that would talk over the next beat
function play(name, vol = 1, rate = 1, delay = 0, maxDur = 0) {
  const buf = BUF[name]; if (!buf) return;
  const src = AC.createBufferSource(), g = AC.createGain(), t = AC.currentTime + delay;
  src.buffer = buf; src.playbackRate.value = rate; g.gain.setValueAtTime(vol, t);
  src.connect(g).connect(AC.destination); src.start(t);
  if (maxDur) { g.gain.setValueAtTime(vol, t + maxDur - .3); g.gain.linearRampToValueAtTime(0, t + maxDur); src.stop(t + maxDur + .05); }
  return src;
}
const SFX = {
  tap() { play('tap', .8); },
  blip() { play('blip', .25, .9 + Math.random() * .3); },
  whoosh() { play('whoosh', .7); },
  heart() { play('heart', .6); },
  break() { play('hit', .8); play('break', .7, 1, .05); play('chloe-gasp', 1, 1, .1); },
  snatch() { play('snatch', .9); },
  crash() { play('thud', 1); play('crash', .8, .9, .04); },
  shutter() { play('shutter', .9); },
  laugh() { play('ryan-laugh', .85, 1, 0, 4.5); play('tiffany-laugh', .8, 1, .15, 3.3); },
  sob() { play('chloe-sob', .7, 1, .3); },
  sting() { play('sting', .8); },
};

const ready = Promise.all([imagesReady, audioReady]);

// ================= FX =================
const fx = $('fx'), ctx = fx.getContext('2d');
let parts = [];
function hearts(x, y, n = 8) { for (let i = 0; i < n; i++) parts.push({ x: x + (Math.random() - .5) * 120, y, vx: (Math.random() - .5) * 2, vy: -2 - Math.random() * 3, life: 1, s: 18 + Math.random() * 16, kind: 'heart' }); }
function crumbs(x, y, n = 30) { const cs = ['#f7a9c4', '#e8436f', '#fff', '#d9a066']; for (let i = 0; i < n; i++) { const a = -Math.PI * Math.random(); parts.push({ x, y, vx: Math.cos(a) * 9 * Math.random(), vy: Math.sin(a) * 10 * Math.random(), life: 1, s: 4 + Math.random() * 6, c: cs[i % 4], kind: 'dot', g: true }); } }
(function loop() {
  ctx.clearRect(0, 0, 720, 1280);
  parts = parts.filter(p => (p.life -= .016) > 0);
  for (const p of parts) {
    p.x += p.vx; p.y += p.vy; if (p.g) p.vy += .5;
    ctx.globalAlpha = Math.min(1, p.life * 1.5);
    if (p.kind === 'heart') { ctx.fillStyle = '#ff5f8f'; ctx.strokeStyle = '#2b1630'; ctx.lineWidth = 3; const s = p.s; ctx.beginPath();
      ctx.moveTo(p.x, p.y + s * .3); ctx.bezierCurveTo(p.x - s, p.y - s * .5, p.x - s * .4, p.y - s, p.x, p.y - s * .45); ctx.bezierCurveTo(p.x + s * .4, p.y - s, p.x + s, p.y - s * .5, p.x, p.y + s * .3); ctx.fill(); ctx.stroke(); }
    else { ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, 7); ctx.fill(); }
  }
  ctx.globalAlpha = 1; requestAnimationFrame(loop);
})();
function shake(mag = 12, dur = 350) { const k = []; for (let i = 0; i < 8; i++) k.push({ translate: `${(Math.random() - .5) * mag * 2}px ${(Math.random() - .5) * mag * 2}px` }); k.push({ translate: '0 0' }); stage.animate(k, { duration: dur }); }
function flash(peak = .8, dur = 220) { $('flash').animate([{ opacity: peak }, { opacity: 0 }], { duration: dur }); }
function fxText(txt, x, y, color = '#fff') {
  const d = document.createElement('div'); d.className = 'fxText outline'; d.textContent = txt; d.style.left = x + 'px'; d.style.top = y + 'px'; d.style.color = color; stage.appendChild(d);
  d.animate([{ transform: 'translate(-50%,-50%) scale(.3) rotate(-10deg)', opacity: 0 }, { transform: 'translate(-50%,-50%) scale(1.15) rotate(4deg)', opacity: 1, offset: .25 },
    { transform: 'translate(-50%,-90%) scale(1) rotate(0)', opacity: 0 }], { duration: 1300, easing: 'ease-out' }).onfinish = () => d.remove();
}

// ================= Layer helpers =================
function show(slot, key, { from, pop = true } = {}) {
  const el = $(slot), cfg = SPR[key];
  el.style.height = cfg.h + 'px';
  if (from !== undefined) { el.style.transition = 'none'; el.style.left = from + 'px'; void el.offsetWidth; el.style.transition = ''; }
  el.src = `assets/${key}.webp`; el.classList.add('on');
  requestAnimationFrame(() => { el.style.left = cfg.left + 'px'; });
  if (pop) { el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
}
function hide(slot) { $(slot).classList.remove('on'); }
let voice = null;
// Types the line in step with its voice clip, then holds for ms after the voice ends
async function say(side, name, key, ms = 600, pink = false) {
  const b = $(side === 'L' ? 'bL' : 'bR'), text = LINES[key], buf = BUF['v-' + key];
  ['bL', 'bR'].forEach(id => $(id).classList.remove('show'));
  b.querySelector('.name').textContent = name; b.classList.toggle('pink', pink);
  const t = b.querySelector('.t'); t.textContent = ''; b.classList.add('show'); skipTyping = false;
  const dur = buf ? buf.duration * 1000 : text.length * 38, t0 = performance.now();
  // A skipped line's voice is cut so two lines never talk over each other
  if (voice) { try { voice.stop(); } catch {} voice = null; }
  if (buf && !Q.has('fast')) voice = play('v-' + key);
  const step = dur * .85 / text.length;
  for (const ch of text) { if (skipTyping) break; t.textContent += ch; if (!buf && ch.trim()) SFX.blip(); await wait(step); }
  t.textContent = text;
  if (!skipTyping && !Q.has('fast')) await wait(Math.max(0, dur - (performance.now() - t0)));
  skipTyping = false;
  await wait(ms);
}
function unsay() { ['bL', 'bR'].forEach(id => $(id).classList.remove('show')); }

// ================= Sequence =================
const H = { state: 'cover' };
async function run() {
  H.state = 'confess';
  show('R', 'ryan-phone', { from: 760 }); SFX.whoosh();
  await wait(450);
  show('L', 'chloe-confess', { from: -400 }); SFX.whoosh();
  await wait(500);
  hearts(240, 640, 10); SFX.heart();
  await say('L', 'Chloe', 'chloe-confess', 500);

  // Rejection
  H.state = 'reject';
  show('R', 'ryan-sneer');
  await say('R', 'Ryan', 'ryan-reject', 200);
  show('L', 'chloe-rejected'); SFX.break(); shake(10, 300);
  await wait(1100);

  // Tiffany walks in and snatches the box
  H.state = 'tiffany';
  unsay();
  $('R').style.left = '250px';  // Ryan steps aside so she fits on screen
  show('R2', 'tiffany-strut', { from: 760 }); SFX.whoosh();
  await say('R', 'Tiffany', 'tiffany-enter', 300, true);
  // The box flies from Chloe's hands to the couple, then the couple layer replaces the two singles
  show('L', 'chloe-empty'); SFX.snatch();
  const box = $('box'); box.style.width = '170px';
  const fly = box.animate([{ left: '230px', top: '700px', opacity: 1, transform: 'rotate(0)' }, { left: '560px', top: '640px', opacity: 1, transform: 'rotate(25deg)' }],
    { duration: Q.has('fast') ? 50 : 380, easing: 'cubic-bezier(.3,0,.3,1)', fill: 'forwards' });
  await fly.finished; fly.cancel();
  hide('R'); hide('R2'); show('R', 'couple-hug');
  await say('R', 'Tiffany', 'tiffany-mock1', 200, true);
  await say('R', 'Ryan', 'ryan-mock', 100);

  // Cookies dumped, both laugh, she breaks down
  H.state = 'mock';
  // Lands on the ground in front of their feet (feet line is y 1190, pile bottom ~y 1280)
  const spill = $('spill'); spill.style.width = '440px';
  spill.animate([{ left: '200px', top: '1085px', opacity: 0, transform: 'translateY(-260px) scale(.6)' }, { left: '200px', top: '1085px', opacity: 1, transform: 'none' }],
    { duration: Q.has('fast') ? 50 : 300, easing: 'cubic-bezier(.5,0,.8,.6)', fill: 'forwards' });
  await wait(260);
  SFX.crash(); crumbs(420, 1215); shake(14, 350);
  show('R', 'couple-mock'); show('L', 'chloe-crying');
  SFX.laugh(); SFX.sob(); fxText('HAHAHA!', 520, 300, '#ffd84d');
  [0, 280, 560].forEach(t => setTimeout(() => { flash(.55, 160); SFX.shutter(); }, t));
  await wait(3000);  // let the laughter land before Tiffany talks over it
  await say('R', 'Tiffany', 'tiffany-mock2', 500, true);
  await say('L', 'Chloe', 'chloe-cry', 600);

  // Freeze on her humiliation for a beat, then straight into the level (no end card)
  H.state = 'end';
  unsay(); SFX.sting();
  $('bg').classList.add('cold'); $('R').style.filter = 'saturate(.3) brightness(.65)'; $('vig').classList.add('on');
  $('L').animate([{ transform: 'scale(1)' }, { transform: 'scale(1.08)' }], { duration: 900, fill: 'forwards', easing: 'ease-out' });
  await wait(900);
  $('skip').style.display = 'none';
  await wait(900);
  toLevel();
}
const LEVEL = 'editor.html?scene=level01-room&player';      // the level built in the editor
function toLevel() { document.body.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 450, fill: 'forwards' }).onfinish = () => { location.href = LEVEL; }; }
$('cover').onclick = async () => { ac(); SFX.tap(); await ready; $('cover').style.display = 'none'; run(); };
$('skip').onclick = e => { e.stopPropagation(); toLevel(); };
$('goBtn').onclick = toLevel;
if (Q.has('test')) window.__hook = H;
// no title card: the story plays as soon as it has loaded (the tap on the level card already let sound start; where a
// browser still holds it back, the first tap anywhere brings it in)
$('cover').style.display = 'none'; ac(); ready.then(run);
addEventListener('pointerdown', ac, true);
</script>
</body>
</html>
