<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>场景编辑器 · 逆袭吧胖妞</title>
<style>
  :root { --ink:#2b1630; --rose:#e8436f; --panel:#1f1824; --panel2:#2a2230; --line:#3d3345; --txt:#eee6f0; --mut:#9c8fa5; --sel:#ffb648; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#141016; color:var(--txt); font:13px/1.4 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; overflow:hidden; }
  #app { display:grid; grid-template-columns:260px 1fr 320px; height:100%; }
  /* ?player: the level alone, full screen, as a player sees it (no editor panels) */
  body.player #app { grid-template-columns:1fr; } body.player aside, body.player #toolbar, body.player #coord { display:none !important; }
  body.player main { width:100%; min-width:0; } body.player #wrap { background:#000; width:100%; height:100%; } body.player #stage { box-shadow:none; }
  aside { background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  aside.right { border-right:0; border-left:1px solid var(--line); }
  h3 { margin:0; padding:10px 12px; font-size:13px; letter-spacing:1px; color:var(--mut); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px; }
  h3 .sp { flex:1; }
  button, select, input, textarea { font:inherit; color:var(--txt); background:var(--panel2); border:1px solid var(--line); border-radius:6px; padding:4px 8px; }
  button { cursor:pointer; } button:hover { border-color:#6b5a78; } button.on { background:var(--rose); border-color:var(--rose); color:#fff; }
  input[type=number] { width:64px; } input[type=checkbox] { width:auto; }
  .scroll { overflow:auto; flex:1; min-height:0; }

  /* asset library */
  #search { margin:8px 12px; width:calc(100% - 24px); }
  .grpT { padding:6px 12px 2px; color:var(--mut); font-size:12px; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; padding:4px 12px 10px; }
  .thumb { aspect-ratio:1; background:#3a3040 repeating-conic-gradient(#433a4a 0 25%, #3a3040 0 50%) 0 0/14px 14px; border:1px solid var(--line); border-radius:6px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; position:relative; overflow:hidden; }
  .thumb img { max-width:92%; max-height:92%; }
  .thumb span { position:absolute; left:0; right:0; bottom:0; font-size:10px; background:#000a; padding:1px 3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .thumb:hover { border-color:var(--sel); }
  .stateMode .thumb { outline:2px dashed var(--sel); }
  .thumb.cur { border-color:var(--sel); box-shadow:0 0 0 2px var(--sel); }
  #assetInfo { border-top:1px solid var(--line); padding:10px 12px; display:flex; flex-direction:column; gap:6px; max-height:46%; overflow:auto; }
  #assetInfo .pv { height:150px; background:#3a3040 repeating-conic-gradient(#433a4a 0 25%, #3a3040 0 50%) 0 0/14px 14px; border-radius:8px; display:flex; align-items:center; justify-content:center; }
  #assetInfo .pv img { max-width:95%; max-height:95%; }
  #assetInfo .kv { display:grid; grid-template-columns:56px 1fr; gap:2px 8px; font-size:12px; }
  #assetInfo .kv b { color:var(--mut); font-weight:400; } #assetInfo .kv span { word-break:break-all; }
  #assetInfo .use { color:var(--sel); cursor:pointer; text-decoration:underline; margin-right:6px; }
  #assetInfo .btns { display:flex; gap:6px; flex-wrap:wrap; }
  .grpSec { border-radius:8px; margin:0 6px; }
  .grpSec.over { outline:3px dashed var(--sel); outline-offset:-3px; background:#ffb64814; }
  .grpEmpty { grid-column:1/-1; border:1px dashed var(--line); border-radius:6px; color:var(--mut); text-align:center; padding:14px 0; font-size:12px; }
  aside.dropUp { outline:3px dashed var(--sel); outline-offset:-6px; }
  #stage.dropping { outline:4px dashed var(--sel); }

  /* center */
  main { display:flex; flex-direction:column; min-width:0; min-height:0; }
  #toolbar { display:flex; gap:6px; align-items:center; padding:8px 12px; border-bottom:1px solid var(--line); background:var(--panel); flex-wrap:wrap; }
  #toolbar .sp { flex:1; }
  #saveState { color:var(--mut); min-width:60px; }
  #wrap { flex:1; position:relative; min-height:0; overflow:hidden; }
  #safeFrame { position:absolute; left:0; top:0; width:720px; height:1280px; pointer-events:none; z-index:9300; }
  .edit #safeFrame { outline:2px dashed #ffffff66; }      /* only while editing: in play the picture is seamless */
  .edit #safeFrame::before { content:"9:16 可玩区"; position:absolute; left:6px; top:-22px; font-size:13px; color:#fff9; }
  #stage { position:absolute; width:720px; height:1280px; transform-origin:0 0; background:#000 center/cover; overflow:hidden; box-shadow:0 0 0 1px #000, 0 10px 40px #000; }
  #grid { position:absolute; inset:0; pointer-events:none; display:none; z-index:9000;
    background:linear-gradient(#ffffff22 1px, transparent 1px) 0 0/40px 40px, linear-gradient(90deg,#ffffff22 1px, transparent 1px) 0 0/40px 40px; }
  #grid.show { display:block; }
  .ly { position:absolute; touch-action:none; }
  .ly.stretch img { object-fit:fill; }
  #pOpR, #pSatR { flex:1; accent-color:var(--rose); }
  .ly img { width:100%; height:100%; display:block; object-fit:contain; object-position:50% 100%; filter:saturate(var(--sat,1)); pointer-events:none; user-select:none; -webkit-user-drag:none; }
  .ly.hid { display:none; }
  /* optional contact shadow so furniture sits on the floor */
  .ly.shad::before { content:""; position:absolute; left:4%; right:4%; bottom:-3%; height:14%; z-index:-1; pointer-events:none;
    background:radial-gradient(closest-side, rgba(70,35,20,.38), rgba(70,35,20,0)); }
  .edit .ly { cursor:move; }
  .edit .ly.lock { pointer-events:none; }
  .edit .ly.sel { outline:2px solid var(--sel); outline-offset:0; }
  .edit .ly:hover:not(.sel) { outline:1px dashed #fff8; }
  .hd { position:absolute; width:18px; height:18px; background:#fff; border:3px solid var(--sel); border-radius:50%; z-index:9001; transform:translate(-50%,-50%); }
  .hd.nw,.hd.se { cursor:nwse-resize; } .hd.ne,.hd.sw { cursor:nesw-resize; }
  #markCv { position:absolute; left:0; top:0; width:720px; height:1280px; z-index:9650; pointer-events:none; display:none; }
  .brushMode #markCv { display:block; pointer-events:auto; cursor:crosshair; }
  #brushBar { display:none; align-items:center; gap:6px; background:#3a1d2c; border:1px solid var(--rose); border-radius:8px; padding:2px 8px; }
  .brushMode #brushBar { display:flex; }
  #brushBar input[type=range] { width:80px; }
  #boxDraw { position:absolute; border:3px dashed #ff3df0; background:#ff3df022; pointer-events:none; z-index:9600; display:none; }
  .boxMode #stage, .boxMode #stage .ly { cursor:crosshair !important; }
  #genDlg { position:fixed; inset:0; background:#0009; display:none; align-items:center; justify-content:center; z-index:100; }
  #genDlg.show { display:flex; }
  #genDlg .box { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px; width:420px; display:flex; flex-direction:column; gap:10px; }
  #genDlg textarea { height:110px; resize:vertical; }
  #genDlg .row { display:flex; gap:8px; justify-content:flex-end; align-items:center; }
  #genDlg select { flex:1; min-width:0; }
  #refPrev { width:44px; height:44px; object-fit:contain; background:#3a3040; border-radius:6px; display:none; }
  .ly.busy::after { content:""; position:absolute; inset:0; border:4px dashed #ff3df0; border-radius:8px; animation:busy 1s linear infinite; pointer-events:none; }
  @keyframes busy { 50% { border-color:#ffb648; } }
  .guide { position:absolute; background:#ff3df0; z-index:9700; pointer-events:none; }
  #marquee { position:absolute; border:2px solid var(--sel); background:#ffb64822; pointer-events:none; z-index:9600; display:none; }
  .panning #wrap, .panning #stage .ly { cursor:grab !important; }
  #zoomLbl { min-width:44px; text-align:center; color:var(--mut); }
  #queue { color:#ff8af5; }
  #ctx { position:fixed; z-index:200; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:4px; min-width:170px; box-shadow:0 8px 30px #000a; display:none; }
  #ctx div { padding:6px 10px; border-radius:5px; cursor:pointer; display:flex; justify-content:space-between; gap:16px; }
  #ctx div:hover { background:var(--rose); color:#fff; }
  #ctx div i { font-style:normal; color:var(--mut); font-size:11px; }
  #ctx hr { border:0; border-top:1px solid var(--line); margin:4px 0; }
  #layerQ { margin:6px 10px; width:calc(100% - 20px); }
  .lrow.multi { background:#3a2c18; }
  .lrow.dropA { box-shadow:inset 0 2px 0 var(--sel); } .lrow.dropB { box-shadow:inset 0 -2px 0 var(--sel); }
  .lrow .grp { font-size:10px; color:#111; background:#9fd6ff; border-radius:3px; padding:0 4px; }
  .lrow input { flex:1; min-width:0; padding:1px 4px; }
  .algn { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-bottom:8px; }
  #agentLog { position:absolute; right:10px; bottom:10px; width:290px; max-height:55%; overflow:auto; background:#1f1824ee; border:1px solid var(--line); border-radius:10px; padding:8px 10px; z-index:20; font-size:12px; }
  #agentLog b { color:#ff8af5; }
  #agentLog .ag { border-top:1px solid var(--line); padding:6px 0; }
  #agentLog .q { color:var(--txt); font-weight:600; }
  #agentLog .st2 { color:var(--mut); margin-top:2px; }
  #agentLog .ag.working .st2, #agentLog .ag.pending .st2 { color:#ffb648; } #agentLog .ag.error .st2 { color:#ff5566; }
  #agentLog a { color:var(--mut); cursor:pointer; font-size:11px; }
  #reviewBtn { background:#4fc3f7; border-color:#4fc3f7; color:#102; font-weight:700; }
  #reviewDlg { position:fixed; left:12px; top:58px; width:460px; max-height:calc(100vh - 80px); overflow:auto; z-index:150; display:none;
    background:var(--panel); border:2px solid #4fc3f7; border-radius:12px; padding:14px; box-shadow:0 12px 40px #000c; }
  #reviewDlg.show { display:block; }
  #reviewDlg h4 { margin:0 0 4px; font-size:15px; } #reviewDlg .pr { color:var(--mut); margin-bottom:10px; }
  #reviewDlg .cands { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin:6px 0 10px; }
  #reviewDlg .cand { aspect-ratio:1; border:3px solid var(--line); border-radius:8px; cursor:pointer; display:flex; align-items:center; justify-content:center; position:relative;
    background:#3a3040 repeating-conic-gradient(#433a4a 0 25%, #3a3040 0 50%) 0 0/14px 14px; }
  #reviewDlg .cand img { max-width:94%; max-height:94%; }
  #reviewDlg .cand.cur { border-color:#4fc3f7; box-shadow:0 0 0 2px #4fc3f7; }
  #reviewDlg .cand i { position:absolute; left:6px; top:4px; font-style:normal; font-size:11px; color:#fff; background:#000a; padding:0 5px; border-radius:4px; }
  #reviewDlg .btns { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; position:sticky; bottom:-14px; background:var(--panel); padding:8px 0 2px; }
  #reviewDlg .act { border-top:1px solid var(--line); padding:8px 0; }
  #reviewDlg .act label { display:flex; gap:6px; align-items:center; font-weight:600; }
  #reviewDlg .nav { float:right; color:var(--mut); }
  #coord { position:absolute; left:8px; bottom:8px; background:#000b; padding:3px 8px; border-radius:4px; color:#fff; font-size:12px; pointer-events:none; z-index:10; }

  /* play mode */
  .play .ly.r-drag, .play .ly.r-tool { cursor:grab; }
  .play .ly.r-toggle { cursor:pointer; }
  .play .ly.dragging { cursor:grabbing; z-index:8000 !important; filter:drop-shadow(0 12px 10px #0008); }
  .play .ly.done { pointer-events:none; }
  .fx { position:absolute; pointer-events:none; z-index:9400; border-radius:50%; }
  .fx.bub { background:radial-gradient(circle at 35% 30%, #fff 0 18%, #e6f6ffcc 30%, #bfe6ff66 70%, transparent 72%); border:2px solid #ffffffd0; }
  .fx.air { border-radius:3px; background:linear-gradient(90deg, transparent, #ffffffe8 40%, transparent); }
  .fx.steam { background:radial-gradient(ellipse, #ffffffd8 0 22%, #f3f7fa80 48%, transparent 70%); filter:blur(3px) drop-shadow(0 0 4px #9fb0c055); z-index:9390; }
  .fx.wisp { border-radius:0; filter:blur(1px) drop-shadow(0 0 3px #8fa2b466); z-index:9390; }
  .fx.gust, .fx.curl { border-radius:0; z-index:9420; filter:drop-shadow(0 0 1px #c9733a) drop-shadow(0 0 4px #ffb27acc); }
  .fx.drip { border-radius:50% 50% 50% 50% / 60% 60% 40% 40%; background:radial-gradient(circle at 35% 30%, #ffffffee 0 25%, #cfeaf8aa 50%, #8fc4e055 80%); box-shadow:0 0 0 .6px #6f8fa055; }
  .fx.glint { border-radius:0; background:#fff; clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%); filter:drop-shadow(0 0 2px #fff); }
  .fx.say { max-width:560px; white-space:normal !important; text-align:center; position:absolute; border-radius:18px; background:#fffdf8; border:3px solid #3b2b2b; color:#3b2b2b; font:700 27px/1.3 'PingFang SC','Hiragino Sans GB',sans-serif;
    padding:10px 20px; white-space:nowrap; z-index:9480; width:auto; height:auto; transform-origin:var(--tail,50%) 100%; box-shadow:0 3px 0 #3b2b2b22; }
  .fx.say::after { content:""; position:absolute; left:calc(var(--tail,50%) - 9px); bottom:-13px; width:16px; height:16px; background:#fffdf8;
    border-right:3px solid #3b2b2b; border-bottom:3px solid #3b2b2b; transform:rotate(45deg) skew(8deg,8deg); border-bottom-right-radius:4px; }
  .fx.ring { border:3px solid #fff; box-shadow:0 1px 4px #0005; z-index:9450; }
  .fx.drum { border-radius:50%; overflow:hidden; z-index:9380; box-shadow:inset 0 0 6px #0006; }
  .fx.drum i { position:absolute; inset:-10%; background:conic-gradient(#ff9ec4 0 14%, #bfe3ff 0 26%, #fff 0 34%, #f6c7dc 0 50%, #9fd0f5 0 62%, #fff4fa 0 72%, #e98fb2 0 86%, #cde9ff 0); filter:blur(2.5px); opacity:.85; }
  .fx.drum b { position:absolute; inset:0; border-radius:50%; background:radial-gradient(circle at 35% 28%, #ffffffcc 0 12%, transparent 30%), linear-gradient(180deg, transparent 45%, #9fd6ff88 55%, #6fb7ec99); }
  .fx.jet { border-radius:50%; background:linear-gradient(180deg, #e9f8ff, #7cc9f4 55%, #3fa3e3); opacity:.9; }
  .puff { position:absolute; border-radius:50%; background:radial-gradient(circle at 40% 32%, #ffffff 0 48%, #f2f3f6 70%, #dcdfe6 100%); }
  .puff.shade { background:#f9e1eb; }
  .puff.lite { background:radial-gradient(circle at 42% 38%, #ffffff 0 62%, #fff7fa 100%); }
  .wispPuff { pointer-events:none; } .wispPuff i, .wispPuff b { position:absolute; border-radius:50%; }
  .wispPuff i { inset:0; background:#f9e1eb; box-shadow:0 0 0 1.5px #e98fb2; } .wispPuff b { left:12%; top:8%; width:68%; height:68%; background:#fffafc; }
  .heartFx svg { width:100%; height:100%; display:block; overflow:visible; filter:drop-shadow(0 1px 1px #0002); }
  .popTool { pointer-events:none; } .popTool img { width:100%; height:100%; object-fit:contain; }
  .fx.drop { border-radius:50%; background:radial-gradient(circle at 35% 30%, #ffffff 0 20%, #9fdcff 45%, #4fb3f0 75%, transparent 78%); }
  .fx.mist { background:radial-gradient(circle, #ffffffe0 0 30%, #e8f6ffa0 55%, transparent 72%); }
  .play .ly.worn img { opacity:0; }
  .fx.star { width:22px; height:22px; border-radius:0; background:#fffdf2;
    clip-path:polygon(50% 0, 56% 44%, 100% 50%, 56% 56%, 50% 100%, 44% 56%, 0 50%, 44% 44%); filter:drop-shadow(0 0 4px #fff6d0); }
  .fx.star.big { background:#fff; filter:drop-shadow(0 0 3px #fff) drop-shadow(0 0 8px #ffd25e) drop-shadow(0 0 2px #b8860b); }
  .fx.glow { background:radial-gradient(circle, #fffdf0f0 0, #fff4cc99 35%, #ffffff00 70%); mix-blend-mode:screen; }
  .fx.wash { border-radius:0; background:linear-gradient(105deg, #fff0 30%, #fffbeaaa 50%, #fff0 70%) no-repeat; background-size:60% 100%; mix-blend-mode:screen; }
  .ly.acting img { animation: acting .55s ease-in-out infinite; transform-origin:50% 100%; }
  .play .ly.breathe > img:first-child { transform-origin:50% 100%; animation:breathe 2.8s ease-in-out infinite; }
  @keyframes breathe { 50% { transform:scale(1.012, 1.03); } }
  .play .ly.breathe-soft:not(.acting):not(.swinging) > img { transform-origin:var(--bo, 50% 100%); animation:breathe-soft 3s ease-in-out infinite; }
  @keyframes breathe-soft { 50% { transform:scale(1.01, 1.022); } }      /* a person: just a hint of breath */
  @keyframes acting { 0%,100% { translate:-7px 0; rotate:-2.5deg; } 50% { translate:7px 0; rotate:2.5deg; } }
  .ly canvas { width:100%; height:100%; display:block; pointer-events:none; }
  #playHud { position:absolute; left:50%; top:16px; transform:translateX(-50%); background:#2b1630e6; color:#fff; font-size:28px; font-weight:800; padding:8px 26px; border-radius:999px; z-index:9500; display:none; }
  .play #playHud { display:none; }      /* progress pill hidden for now (designer's call); updHud still tracks it */
  #playMsg { position:absolute; left:50%; top:90px; transform:translateX(-50%); background:#fff6ea; color:var(--ink); font-size:26px; font-weight:700; padding:10px 24px; border-radius:999px; border:4px solid var(--ink); z-index:9500; opacity:0; transition:.2s; pointer-events:none; white-space:nowrap; }
  #playMsg.show { opacity:1; }

  /* right panel */
  #layers { max-height:38%; border-bottom:1px solid var(--line); }
  .lrow { display:flex; align-items:center; gap:6px; padding:4px 10px; border-bottom:1px solid #2c2433; cursor:pointer; }
  .lrow:hover { background:#2a2230; } .lrow.sel { background:#4a3518; }
  .lrow img { width:28px; height:28px; object-fit:contain; background:#3a3040; border-radius:4px; }
  .lrow .nm { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lrow .rl { font-size:11px; color:var(--mut); }
  .ico { background:none; border:0; padding:0 3px; color:var(--mut); font-size:14px; }
  .ico.off { opacity:.35; }
  #props { padding:10px 12px 30px; }
  #props .row { display:flex; align-items:center; gap:6px; margin-bottom:8px; flex-wrap:wrap; }
  #props label { color:var(--mut); min-width:52px; }
  #props input[type=text], #props select, #props textarea { flex:1; min-width:0; }
  #props textarea { height:54px; resize:vertical; }
  .states { display:flex; gap:6px; flex-wrap:wrap; }
  .st { width:54px; height:54px; border:2px solid var(--line); border-radius:6px; background:#3a3040; position:relative; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .st img { max-width:48px; max-height:48px; }
  .st.cur { border-color:var(--sel); }
  .st b { position:absolute; right:-6px; top:-6px; width:16px; height:16px; line-height:14px; text-align:center; background:#c33; border-radius:50%; font-size:12px; }
  .hint { color:var(--mut); font-size:12px; line-height:1.6; padding:10px 12px; }
  .sect { margin:14px 0 8px; color:var(--sel); font-weight:700; }
</style>
</head>
<body>
<div id="app">
  <aside>
    <h3>素材库<span class="sp"></span><button id="upBtn" title="上传本地图片">上传</button><input type="file" id="upFile" accept="image/*" multiple hidden></h3>
    <input id="search" placeholder="搜索素材">
    <div class="scroll" id="lib"></div>
    <div id="assetInfo"><div class="hint" style="padding:0">点击素材查看详情；把素材拖到画面上＝放进场景（拖到哪就放在哪）<br>从电脑拖图片到某个分组＝上传到该分组，拖到画面上＝上传并放进场景<br>把素材拖到另一个分组＝换分组；「背景」组的图点一下就设为背景<br>选中图层后，在素材详情里点「加为某图层的状态」＝加一个状态图</div></div>
  </aside>

  <main>
    <div id="toolbar">
      <button id="modeEdit" class="on">编辑</button><button id="modePlay">试玩</button>
      <button id="resetPlay" style="display:none">重置试玩</button>
      <button id="stepBack" style="display:none" title="回到上一步完成之前（⌘Z）">上一步</button>
      <select id="jumpTo" style="display:none" title="从头开始，自动完成这一步之前的所有步骤"></select>
      <select id="lang" style="display:none" title="台词语言（英文带配音）"><option value="en">English</option><option value="zh">中文</option></select>
      <span style="width:10px"></span>
      <button id="undo" title="Cmd/Ctrl+Z">撤销</button><button id="redo" title="Shift+Cmd/Ctrl+Z">重做</button>
      <button id="gridBtn">网格</button><button id="genBtn" title="在画面上拖一个框，输入物体，就在框里生成透视匹配的独立图层">框选生成</button><button id="brushBtn" title="用画笔在画面上圈出要改的地方，再写修改需求（B）">画笔圈改</button>
      <span id="brushBar">粗细 <input type="range" id="brushSize" min="6" max="80" value="22"><button id="brushUndo">撤销一笔</button><button id="brushClear">清空</button><button id="brushDone" class="on">写需求</button><button id="brushCancel">退出</button></span>
      <span style="width:10px"></span>
      <button id="zoomOut" title="Cmd/Ctrl -">−</button><span id="zoomLbl"></span><button id="zoomIn" title="Cmd/Ctrl +">＋</button><button id="zoomFit" title="Cmd/Ctrl 0">适应</button>
      <span id="queue"></span><button id="reviewBtn" style="display:none"></button>

<script>
'use strict';
const $ = id => document.getElementById(id);
const stage = $('stage'), wrap = $('wrap');
const ROLES = { decor: '装饰', drag: '可拖动物品', target: '拖放目标', tool: '工具（反复使用）', scrub: '污渍（可擦除）', wipe: '覆盖物（工具擦到哪掉到哪）', toggle: '点击切换状态', act: '点击触发（过场动作）', hold: '长按（如放水）', swipe: '右滑推开' };
const W = 720, H = 1280;

// ================= State =================
let scene = null, sceneName = new URLSearchParams(location.search).get('scene') || 'level01-room';

const selX = new Set();   // other selected layers besides the primary selId
function selected() { return scene.layers.filter(l => l.id === selId || selX.has(l.id)); }
function isSel(l) { return l.id === selId || selX.has(l.id); }
function selectOnly(id) {     // also pulls in the rest of the layer's group

}
function toggleSel(id) {

}
const hist = [], redoStack = [];
const nat = {};   // src -> [naturalW, naturalH]

function defaultScene() {

}
function layer(id) { return scene.layers.find(l => l.id === id); }

// ================= Server =================
async function api(path, body) {

}

}

async function save() {

    if (r.error === 'stale') { $('saveState').textContent = '场景已在别处更新，请刷新页面（这次改动没保存）'; return; }
    sceneRev = r.rev; $('saveState').textContent = '已保存';
  } catch { $('saveState').textContent = '保存失败（服务没开？）'; }
}
async function loadScene(name) {
  sceneName = name; history.replaceState(null, '', '?scene=' + encodeURIComponent(name) + (new URLSearchParams(location.search).has('player') ? '&player' : ''));
  let s = null; try { s = await api('api/scene?name=' + encodeURIComponent(name)); } catch {}
  scene = s || defaultScene(); sceneRev = (s && s.rev) || 0; lastSnap = JSON.stringify(scene); hist.length = 0; redoStack.length = 0; selectOnly(null);
  await Promise.all(scene.layers.flatMap(l => l.states).map(measure));

  if (!s) save();
}
async function refreshScenes() {
  let list = []; try { list = await api('api/scenes'); } catch {}
  if (!list.includes(sceneName)) list.push(sceneName);
  $('sceneSel').innerHTML = list.map(n => `<option ${n === sceneName ? 'selected' : ''}>${n}</option>`).join('');
}

// ================= Asset library =================
let assets = [];
function measure(src) {

}
let assetGroups = {};    // path -> group the designer put it in (server-side groups.json)
async function loadLib(force) {
  let list, groups; try { [list, groups] = await Promise.all([api('api/assets'), api('api/asset-groups')]); } catch { return; }
  if (!force && JSON.stringify([list, groups]) === JSON.stringify([assets, assetGroups])) return;
  assets = list; assetGroups = groups; renderLib();
}
async function setGroupOf(paths, g) {
  const upd = Object.fromEntries(paths.map(p => [p, g]));

}
setInterval(loadLib, 5000);     // new uploads and generated assets show up on their own
const GROUPS = ['背景', '人物', '道具'];
function group(f) {      // the designer's choice, else guessed from the file name

  return n.startsWith('bg-') ? '背景' : n.startsWith('chloe') ? '人物' : '道具';
}
function renderLib() {
  const q = $('search').value.trim(), lib = $('lib'); lib.innerHTML = '';
  const groups = {};
  assets.filter(f => !q || f.includes(q)).forEach(f => (groups[group(f)] ||= []).push(f));

    sec.innerHTML = `<div class="grpT">${g}（${(groups[g] || []).length}）</div>`;
    const grid = document.createElement('div'); grid.className = 'grid';
    if (!groups[g]) grid.innerHTML = '<div class="grpEmpty">把图片拖到这里</div>';
    sec.ondragover = e => { if (e.dataTransfer.types.includes('Files') || e.dataTransfer.types.includes('text/x-asset')) { e.preventDefault(); e.stopPropagation(); sec.classList.add('over'); } };

    sec.ondrop = async e => {
      e.preventDefault(); e.stopPropagation(); sec.classList.remove('over');
      const moved = e.dataTransfer.getData('text/x-asset');
      if (moved) return setGroupOf([moved], g);
      const paths = await uploadFiles(e.dataTransfer.files);
      if (paths.length) { await setGroupOf(paths, g); showAsset(paths[paths.length - 1]); }
    };
    sec.appendChild(grid); lib.appendChild(sec);
    for (const f of groups[g] || []) {
      const t = document.createElement('div'); t.className = 'thumb' + (f === curAsset ? ' cur' : ''); t.title = f; t.draggable = true;
      t.innerHTML = `<img src="${f}" loading="lazy" draggable="false"><span>${f.split('/').pop().replace(/\.\w+$/, '')}</span>`;
      t.onclick = () => stateMode && layer(selId) ? pickAsset(f) : showAsset(f);
      t.oncontextmenu = e => { e.preventDefault(); deleteAsset(f); };

}
// ---- asset details (click) ----
let curAsset = null;
const usedBy = src => scene.layers.filter(l => l.states.includes(src));
async function showAsset(f) {
  curAsset = f; renderLib();
  const [nw, nh] = await measure(f);
  let size = '';
  try { const r = await fetch(f, { method: 'HEAD' }); const b = +r.headers.get('Content-Length'); size = b > 1e6 ? (b / 1e6).toFixed(1) + ' MB' : Math.round(b / 1e3) + ' KB'; } catch {}
  if (curAsset !== f) return;
  const isBg = group(f) === '背景', uses = usedBy(f), L = layer(selId);
  $('assetInfo').innerHTML = `<div class="pv"><img src="${f}"></div>
    <div class="kv"><b>文件名</b><span>${f.split('/').pop()}</span><b>路径</b><span>${f}</span>
      <b>尺寸</b><span>${nw} × ${nh}</span><b>大小</b><span>${size || '—'}</span>
      <b>使用中</b><span>${isBg ? (scene.bg === f ? '当前背景' : '未使用') : uses.length ? uses.map(l => `<a class="use" data-id="${l.id}">${l.id}</a>`).join('') : '未使用'}</span></div>
    <div class="btns">${isBg ? `<button id="aBg" ${scene.bg === f ? 'disabled' : ''}>设为背景</button>` : `<button id="aPlace">放进场景</button>`}
      ${L && !isBg ? `<button id="aState">加为「${L.id}」的状态</button>` : ''}<button id="aDel">删除素材</button><button id="aClose">关闭</button></div>`;
  $('assetInfo').querySelectorAll('.use').forEach(a => a.onclick = () => { selectOnly(a.dataset.id); renderAll(); });
  if ($('aBg')) $('aBg').onclick = () => { scene.bg = f; commit(); renderAll(); showAsset(f); };
  if ($('aPlace')) $('aPlace').onclick = () => pickAsset(f);
  if ($('aState')) $('aState').onclick = async () => { L.states.push(f); L.state = L.states.length - 1; await measure(f); commit(); renderAll(); showAsset(f); };
  $('aDel').onclick = () => deleteAsset(f);
  $('aClose').onclick = () => { curAsset = null; renderLib(); $('assetInfo').innerHTML = '<div class="hint" style="padding:0">点击素材查看详情；把素材拖到画面上＝放进场景</div>'; };
}
// ---- delete: the file goes to asset-trash/ on the server (recoverable), layers using it are warned about ----
async function deleteAsset(f) {
  const isBg = scene.bg === f, uses = usedBy(f);
  const warn = isBg ? '\n\n注意：它是当前场景的背景。' : uses.length ? `\n\n注意：图层 ${uses.map(l => '「' + l.id + '」').join('、')} 正在用它，删除后这些图层会显示不出来。` : '';
  if (!confirm(`删除素材 ${f.split('/').pop()}？${warn}\n\n文件会移到 asset-trash 文件夹，需要时可以找回。`)) return;
  const r = await fetch('api/asset-delete?path=' + encodeURIComponent(f), { method: 'POST' }).then(r => r.json()).catch(() => ({}));
  if (!r.ok) return alert('删除失败');
  if (curAsset === f) { curAsset = null; $('assetInfo').innerHTML = '<div class="hint" style="padding:0">点击素材查看详情；把素材拖到画面上＝放进场景</div>'; }
  await loadLib();
}
// ---- drag an asset onto the stage to place it there ----
// (also image files from the desktop: uploaded, then placed where dropped)
const dragKind = e => e.dataTransfer.types.includes('text/x-asset') ? 'asset' : e.dataTransfer.types.includes('Files') ? 'file' : null;
wrap.addEventListener('dragover', e => { if (mode === 'edit' && dragKind(e)) { e.preventDefault(); stage.classList.add('dropping'); } });
wrap.addEventListener('dragleave', e => { if (!wrap.contains(e.relatedTarget)) stage.classList.remove('dropping'); });
wrap.addEventListener('drop', async e => {
  const kind = dragKind(e); stage.classList.remove('dropping');
  if (!kind || mode !== 'edit') return; e.preventDefault();
  const [x, y] = toStage(e);
  if (kind === 'asset') return pickAsset(e.dataTransfer.getData('text/x-asset'), [x, y]);
  const paths = await uploadFiles(e.dataTransfer.files);
  for (const [i, p] of paths.entries()) await pickAsset(p, [x + i * 24, y + i * 24]);
});
// drop files on the library panel: upload only
const libPane = $('lib').parentElement;
libPane.addEventListener('dragover', e => { if (e.dataTransfer.types.includes('Files')) { e.preventDefault(); libPane.classList.add('dropUp'); } });
libPane.addEventListener('dragleave', e => { if (!libPane.contains(e.relatedTarget)) libPane.classList.remove('dropUp'); });
libPane.addEventListener('drop', async e => {
  libPane.classList.remove('dropUp');
  if (!e.dataTransfer.types.includes('Files')) return; e.preventDefault();
  const paths = await uploadFiles(e.dataTransfer.files);
  if (paths.length) { await setGroupOf(paths, '道具'); showAsset(paths[paths.length - 1]); }
});
// stop the browser from opening a file dropped anywhere else
addEventListener('dragover', e => e.preventDefault()); addEventListener('drop', e => e.preventDefault());
async function pickAsset(src, at) {     // at: [x, y] stage point to center the new layer on
  if (mode !== 'edit') return;
  const L = layer(selId);
  if (stateMode && L) { L.states.push(src); await measure(src); setStateMode(false); commit(); renderAll(); return; }
  if (group(src) === '背景') { scene.bg = src; commit(); renderAll(); return; }
  const [nw, nh] = await measure(src);
  const isChar = group(src) === '人物';
  const k = isChar ? 470 / nh : 150 / Math.max(nw, nh);
  const w = Math.round(nw * k), h = Math.round(nh * k);
  const [cx, cy] = at || [W / 2, H / 2];
  const l = { id: uniqueId(src), states: [src], state: 0, x: Math.round(cx - w / 2), y: Math.round(cy - h / 2), w, h, rot: 0, op: 1, flip: false,
    hidden: false, locked: false, role: 'decor', target: '', tool: '', req: '', msg: '', note: '' };
  scene.layers.push(l); selectOnly(l.id); commit(); renderAll();
}
$('search').oninput = renderLib;
$('upBtn').onclick = () => $('upFile').click();
// upload image files to assets/level01/uploads; names keep ASCII chars and never overwrite. Returns asset paths.
async function uploadFiles(files) {
  const paths = [];
  for (const f of [...files].filter(f => /^image\/(png|jpe?g|webp)$/.test(f.type))) {
    const ext = (f.name.match(/\.(png|jpe?g|webp)$/i) || ['', f.type.split('/')[1]])[1].toLowerCase();
    let base = f.name.replace(/\.[^.]*$/, '').replace(/[^\p{L}\p{N}_\-]/gu, '_').replace(/_+/g, '_').replace(/^_|_$/g, '') || 'img';
    let name = `${base}.${ext}`, i = 2;
    while ([...assets, ...paths].includes('assets/level01/uploads/' + name)) name = `${base}_${i++}.${ext}`;
    const r = await fetch('api/upload?name=' + encodeURIComponent(name), { method: 'POST', body: f }).then(r => r.json()).catch(() => ({}));
    if (r.path) paths.push(r.path);
  }
  await loadLib();
  return paths;
}
$('upFile').onchange = async () => { await uploadFiles($('upFile').files); $('upFile').value = ''; };
function setStateMode(on) { stateMode = on; document.body.classList.toggle('stateMode', on); const b = $('addState'); if (b) b.classList.toggle('on', on); }

// ================= Stage rendering =================
let S = 1, VX = 0, VY = 0, userView = false;    // stage scale and offset inside #wrap
function applyView() {
  stage.style.transform = `scale(${S})`; stage.style.left = VX + 'px'; stage.style.top = VY + 'px';
  $('zoomLbl').textContent = Math.round(S * 100) + '%';
  if (scene && mode === 'edit') drawHandles();
}
const bleedOf = () => PLAYER || mode === 'play' ? 0 : (scene && +scene.bleed) || 0;      // extra picture above and below the 9:16 play area (long phones); play shows just the 9:16
function fit() {
  const r = wrap.getBoundingClientRect();
  const B = bleedOf();
  const pad = PLAYER ? 0 : 30;
  S = Math.max(.1, Math.min((r.width - pad) / W, (r.height - pad) / (H + 2 * B)));
  VX = (r.width - W * S) / 2; VY = (r.height - H * S) / 2; userView = false; applyView();
}
function zoomAt(f, cx, cy) {     // cx, cy: point in #wrap that stays put
  const r = wrap.getBoundingClientRect();
  if (cx === undefined) { cx = r.width / 2; cy = r.height / 2; }
  const ns = Math.min(4, Math.max(.1, S * f));
  VX = cx - (cx - VX) * ns / S; VY = cy - (cy - VY) * ns / S; S = ns; userView = true; applyView();
}
addEventListener('resize', () => { if (!userView) fit(); });
// trackpad pinch / Cmd+wheel zooms at the cursor, plain scroll pans
wrap.addEventListener('wheel', e => {
  e.preventDefault();
  const r = wrap.getBoundingClientRect();
  if (e.ctrlKey || e.metaKey) zoomAt(Math.exp(-e.deltaY * .01), e.clientX - r.left, e.clientY - r.top);
  else { VX -= e.deltaX; VY -= e.deltaY; userView = true; applyView(); }
}, { passive: false });
// hold Space (or use the middle button) and drag to pan
let spaceDown = false;
addEventListener('keydown', e => { if (e.code === 'Space' && !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) { e.preventDefault(); if (!spaceDown) { spaceDown = true; document.body.classList.add('panning'); } } });
addEventListener('keyup', e => { if (e.code === 'Space') { spaceDown = false; document.body.classList.remove('panning'); } });
wrap.addEventListener('pointerdown', e => {
  if (!spaceDown && e.button !== 1) return;
  e.stopPropagation(); e.preventDefault();
  const sx = e.clientX - VX, sy = e.clientY - VY;
  const move = ev => { VX = ev.clientX - sx; VY = ev.clientY - sy; userView = true; applyView(); };
  const up = () => { removeEventListener('pointermove', move); removeEventListener('pointerup', up); };
  addEventListener('pointermove', move); addEventListener('pointerup', up);
}, true);
$('zoomIn').onclick = () => zoomAt(1.25); $('zoomOut').onclick = () => zoomAt(.8); $('zoomFit').onclick = fit;

}

  stage.style.overflow = B ? 'visible' : ''; stage.style.clipPath = B ? `inset(-${B}px 0 -${B}px 0)` : '';
  let fr = $('safeFrame'); if (!fr) { fr = document.createElement('div'); fr.id = 'safeFrame'; stage.appendChild(fr); }
  fr.style.display = B ? '' : 'none';

  layers.forEach((l, i) => {
    const el = document.createElement('div'); el.className = `ly r-${l.role}`; el.dataset.id = l.id;
    if (l.hidden) el.classList.add('hid'); if (l.locked) el.classList.add('lock'); if (l.shadow) el.classList.add('shad'); if (l.stretch) el.classList.add('stretch');

    if (mode === 'play' && unseen(l)) el.classList.add('hid');
    if (mode === 'play' && P.away && P.away.has(l.id)) el.classList.add('hid');

// ================= Play mode =================
let P = null;
const ids = s => (s || '').split(',').map(x => x.trim()).filter(Boolean);
// ---- swipe right (the tub): the picture switches to its cut-out and follows the finger to the right, hidden past
// "clip" (x,y,w,h on the stage: the doorway); the "reveal" layer behind it shows meanwhile. Far enough → it slides
// away, then "wash" (a washer layer with "drum": x,y,r) runs a short wash and "gives" (the gown) flies out of it.
function swipeDown(e, l, el) {
  const [sx] = toStage(e), img = el.querySelector('img'), cr = String(l.clip || '').split(',').map(Number);
  const right = cr.length === 4 ? cr[0] + cr[2] : 1e9;
  const rv = l.reveal && stage.querySelector(`.ly[data-id="${CSS.escape(l.reveal)}"]`);
  if (rv) { rv.classList.remove('hid'); rv.style.opacity = 1; }
  if (l.states[1]) img.src = l.states[1];
  let dx = 0;
  const place = d => { dx = d; el.style.left = l.x + d + 'px'; const over = l.x + d + l.w - right; el.style.clipPath = over > 0 ? `inset(0 ${over}px 0 0)` : ''; };
  const move = ev => { const [x] = toStage(ev); place(Math.max(-4, x - sx)); };
  const up = () => {
    removeEventListener('pointermove', move); removeEventListener('pointerup', up);
    const t0 = performance.now(), from = dx;
    if (dx > l.w * .22) {                       // pushed far enough: it slides away behind the door frame
      P.busy = true;
      const go = now => { const k = Math.min(1, (now - t0) / 320); place(from + (l.w + 8 - from) * k * k);
        if (k < 1) return requestAnimationFrame(go);
        el.classList.add('hid');
        const fin = () => { P.busy = false; for (const x of effects(l.sets, ',')) setState(x.id, x.st, x.dur || 300); markDone(l); };
        l.wash ? washRun(l, fin) : fin();
      };
      requestAnimationFrame(go);
    } else {                                   // not far enough: back in place
      const back = now => { const k = Math.min(1, (now - t0) / 220); place(from * (1 - k));
        if (k < 1) return requestAnimationFrame(back);
        img.src = l.states[0]; if (rv && unseen(P.layers.find(t => t.id === l.reveal))) rv.classList.add('hid');
      };
      requestAnimationFrame(back);
    }
  };
  addEventListener('pointermove', move); addEventListener('pointerup', up);
}
// a full laundry basket dropped on the washer: it tips over the porthole and the clothes go in, then the wash runs
function dumpWash(l, el) {
  const w = P.layers.find(t => t.id === l.wash), [dx, dy] = String(w && w.drum || '').split(',').map(Number);
  P.busy = true;
  const cx = (isNaN(dx) ? w.x + w.w / 2 : dx) - l.w / 2, cy = (isNaN(dy) ? w.y + w.h / 2 : dy) - l.h * .75;
  el.style.transformOrigin = '50% 75%';          // a shrunken (far away) basket tips over the drum around its lower middle
  el.style.transition = 'left .3s ease-out, top .3s ease-out'; el.style.left = cx + 'px'; el.style.top = cy + 'px';
  setTimeout(() => {
    el.style.transition = '';
    el.animate([{ transform: 'rotate(0) scale(1)', opacity: 1 }, { transform: 'rotate(-35deg) scale(.95)', opacity: 1, offset: .45 }, { transform: 'rotate(-35deg) scale(.6)', opacity: 0 }],
      { duration: 650, easing: 'ease-in-out', fill: 'forwards' });
    for (let i = 0; i < 6; i++) setTimeout(() => bubble(cx + l.w * .5 + (Math.random() - .5) * 30, cy + l.h * .8), i * 80);
    setTimeout(() => {
      el.classList.add('done', 'hid');
      washRun(l, () => { for (const x of effects(l.sets, ',')) setState(x.id, x.st, 300); P.busy = false; markDone(l); });
    }, 650);
  }, 320);
}
function washRun(l, done) {
  const w = P.layers.find(t => t.id === l.wash), we = stage.querySelector(`.ly[data-id="${CSS.escape(l.wash)}"]`);
  const [dx, dy, dr] = String(w && w.drum || '').split(',').map(Number);
  if (!w || !we || isNaN(dr)) return done();
  const SHAKE = [{ translate: '0 0' }, { translate: '-1.5px .5px' }, { translate: '1.5px -.5px' }, { translate: '-1px -.5px' }, { translate: '0 0' }];
  const shake = we.animate(SHAKE, { duration: 140, iterations: Infinity });
  const drum = document.createElement('div'); drum.className = 'fx drum';
  Object.assign(drum.style, { left: dx - dr + 'px', top: dy - dr + 'px', width: 2 * dr + 'px', height: 2 * dr + 'px' });
  drum.innerHTML = '<i></i><b></b>'; stage.appendChild(drum);
  drum.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300, fill: 'forwards' });
  const spin = drum.querySelector('i').animate([{ transform: 'rotate(0)' }, { transform: 'rotate(360deg)' }], { duration: 520, iterations: Infinity });
  const drumShake = drum.animate(SHAKE, { duration: 140, iterations: Infinity });      // rattles along with the machine, staying in its porthole
  const bubbles = setInterval(() => {         // suds foam out around the porthole

    const g = P.layers.find(t => t.id === l.gives);

    f.innerHTML = `<img src="${g.states[g.state] || g.states[0]}" style="width:100%;height:100%;object-fit:contain;object-position:50% 100%">`; stage.appendChild(f);
    const ox = dx - (g.x + g.w / 2), oy = dy - (g.y + g.h / 2), mx = ox * .5, my = Math.min(oy, 0) - 70;
    f.animate([{ transform: `translate(${ox}px, ${oy}px) scale(.25) rotate(-20deg)`, opacity: 0 },
      { transform: `translate(${ox}px, ${oy - 18}px) scale(.45) rotate(-10deg)`, opacity: 1, offset: .2 },
      { transform: `translate(${mx}px, ${my}px) scale(.85) rotate(8deg)`, offset: .6 },

  `<div class="cand ${k === cur ? 'cur' : ''}" data-${name}="${k}"><i>${k + 1}</i><img src="${c.src}"></div>`).join('')}</div>`;
function renderReview() {
  const all = reviews(), r = all[revIdx], box = $('reviewDlg');
  if (!r) return closeReview();
  const nav = all.length > 1 ? `<span class="nav">${revIdx + 1} / ${all.length} <button id="rvPrev">‹</button><button id="rvNext">›</button></span>` : '';
  let html = '', btns = '';
  if (r.type === 'edit') {
    const l = r.layer, g = l.gen;
    html = `<h4>${nav}修改「${l.id}」</h4><div class="pr">${g.prompt}</div>
      <div class="pr">原图</div><div class="cands"><div class="cand"><img src="${g.src}"></div></div>
      <div class="pr">结果（点选，画面上同步预览）</div>${candHtml(g.cands, revPick)}`;
    btns = `<button id="rvReplace" class="on">替换当前图</button><button id="rvAdd">加为新状态</button>`;
  } else if (r.type === 'box') {
    const l = r.layer, g = l.gen;
    html = `<h4>${nav}新增「${l.id}」</h4><div class="pr">${g.prompt}</div><div class="pr">结果（点选，画面上同步预览）</div>${candHtml(g.cands, revPick)}`;
    btns = `<button id="rvUse" class="on">放进场景</button>`;
  } else if (r.type === 'states') {
    const l = r.layer, g = l.gen;
    html = `<h4>${nav}「${l.id}」点击后的状态</h4><div class="pr">${g.prompt}</div>
      <div class="pr">现在</div><div class="cands"><div class="cand"><img src="${g.closed}"></div></div>
      <div class="pr">点击后（点选，画面上同步预览）</div>${candHtml(g.cands, revPick)}`;
    btns = `<button id="rvUse" class="on">设为点击后的状态</button>`;
  } else if (r.type === 'bg') {
    const g = scene.bgGen;
    html = `<h4>${nav}修改背景</h4><div class="pr">${g.prompt}</div>
      <div class="pr">原图</div><div class="cands"><div class="cand"><img src="${scene.bg}"></div></div>
      <div class="pr">结果（点选，画面上同步预览）</div>${candHtml(g.cands, revPick)}`;
    btns = `<button id="rvBg" class="on">换成这张背景</button>`;
  } else {
    const e = r.entry, acts = e.result.actions || [];
    html = `<h4>${nav}AI 助手：${e.prompt}</h4><div class="pr">${e.summary || ''}</div>` + (acts.length ? acts.map((a, k) => `<div class="act">
      <label><input type="checkbox" data-take="${k}" ${a.error || a.skip ? '' : 'checked'} ${a.error ? 'disabled' : ''}> ${actLabel(a)}</label>
      ${a.error ? `<div class="pr">失败：${a.error}</div>` : a.candidates ? candHtml(a.candidates, a.pick || 0, 'a' + k) : ''}</div>`).join('')
      : '<div class="pr">它没有安排任何操作。</div>');
    btns = acts.length ? `<button id="rvApply" class="on">应用勾选的</button>` : '';
  }
  // box / edit / background results can be re-run right here, optionally with a tweaked prompt
  const regenable = r.type !== 'agent' && r.type !== 'states', g0 = r.type === 'bg' ? scene.bgGen : r.layer && r.layer.gen;
  if (regenable) html += `<div class="pr" style="margin-top:4px">不满意？改一下描述再生成（同样的位置、模型和数量）</div>
    <textarea id="rvPrompt" style="width:100%;height:64px;resize:vertical">${g0.prompt}</textarea>`;
  box.innerHTML = html + `<div class="btns"><button id="rvLater">稍后再看</button><button id="rvDrop">都不要</button>${regenable ? '<button id="rvRegen">重新生成</button>' : ''}${btns}</div>`;
  if ($('rvRegen')) $('rvRegen').onclick = () => regenReview(r, $('rvPrompt').value.trim() || g0.prompt);
  box.classList.add('show');
  box.querySelectorAll('.cand[data-c]').forEach(d => d.onclick = () => { revPick = +d.dataset.c; renderReview(); });
  if (r.type === 'agent') r.entry.result.actions.forEach((a, k) => {
    box.querySelectorAll(`.cand[data-a${k}]`).forEach(d => d.onclick = () => { a.pick = +d.getAttribute('data-a' + k); renderReview(); });
    const cb = box.querySelector(`[data-take="${k}"]`); if (cb) cb.onchange = () => { a.skip = !cb.checked; previewReview(r); };
  });
  if ($('rvPrev')) { $('rvPrev').onclick = () => openReview((revIdx - 1 + all.length) % all.length); $('rvNext').onclick = () => openReview((revIdx + 1) % all.length); }
  $('rvLater').onclick = closeReview;
  $('rvDrop').onclick = () => finishReview(r, null);
  if ($('rvReplace')) $('rvReplace').onclick = () => finishReview(r, 'replace');
  if ($('rvAdd')) $('rvAdd').onclick = () => finishReview(r, 'add');
  if ($('rvUse')) $('rvUse').onclick = () => finishReview(r, 'use');
  if ($('rvBg')) $('rvBg').onclick = () => finishReview(r, 'use');
  if ($('rvApply')) $('rvApply').onclick = () => finishReview(r, 'use');
  previewReview(r);
}
function actLabel(a) {
  return { add_object: `新增物体「${a.name || ''}」`, add_decal: `新增可擦除污渍「${a.name || ''}」`, edit_layer: `修改「${a.layer}」${a.mode === 'add_state' ? '（加为新状态）' : ''}`,
    edit_background: '修改背景', update_layer: `调整「${a.layer}」的位置/大小`, delete_layer: `删除「${a.layer}」`, reorder_layer: `调整「${a.layer}」的层级` }[a.type] || a.type;
}
// show the picked candidate(s) on the stage without touching the scene data
function previewReview(r) {
  renderStage();
  const el = id => stage.querySelector(`.ly[data-id="${CSS.escape(id)}"]`);
  const put = (l, c, keepBox) => {
    const e = el(l.id); if (!e) return;
    e.querySelector('img').src = c.src;
    if (!keepBox) Object.assign(e.style, { left: c.x + 'px', top: c.y + 'px', width: c.w + 'px', height: c.h + 'px' });
  };
  if (r.type === 'edit') put(r.layer, r.layer.gen.cands[revPick], true);
  else if (r.type === 'box') put(r.layer, r.layer.gen.cands[revPick]);
  else if (r.type === 'states') { const [x, y, w, h] = r.layer.gen.rect; put(r.layer, { src: r.layer.gen.cands[revPick].src, x, y, w, h }); }
  else if (r.type === 'bg') stage.style.backgroundImage = `url(${scene.bgGen.cands[revPick].src})`;
  else for (const a of r.entry.result.actions || []) {
    if (a.skip || a.error || !a.candidates) continue;
    const c = a.candidates[a.pick || 0];
    if (a.type === 'edit_background') stage.style.backgroundImage = `url(${c.src})`;
    else if (a.type === 'edit_layer' && layer(a.layer)) put(layer(a.layer), c, true);
    else if (a.type === 'add_object' || a.type === 'add_decal') {
      const d = document.createElement('div'); d.className = 'ly'; d.style.zIndex = 8500;
      Object.assign(d.style, { left: c.x + 'px', top: c.y + 'px', width: c.w + 'px', height: c.h + 'px', outline: '2px dashed #4fc3f7' });
      d.innerHTML = `<img src="${c.src}">`; stage.appendChild(d);
    }
  }
}
async function regenReview(r, prompt) {
  closeReview();
  if (r.type === 'edit') await submitEdit(r.layer, prompt, r.layer.gen.ref || '', true);
  else if (r.type === 'box') { const g = r.layer.gen; await submitGen(g.rect, prompt, g.kind, r.layer, g.ref || '', g.ch); }
  else { const g = scene.bgGen; await submitBg(prompt, g.ref || '', g.marks, g.ch); }
  updReviewBtn();
  if (reviews().length) openReview(0);
}
function finishReview(r, how) {
  if (r.type === 'edit') {
    const l = r.layer, g = l.gen, c = g.cands[revPick];
    if (how === 'replace') { l.states[l.state] = c.src; g.slot = l.state; }
    else if (how === 'add') { l.states.push(c.src); l.state = g.slot = l.states.length - 1; }
    g.status = how ? 'done' : 'discarded';
  } else if (r.type === 'box') {
    const l = r.layer, g = l.gen;
    if (how) { const c = g.cands[revPick]; l.states = [c.src]; l.state = 0; g.slot = 0; Object.assign(l, { x: c.x, y: c.y, w: c.w, h: c.h }); g.status = 'done'; }
    else scene.layers.splice(scene.layers.indexOf(l), 1);
  } else if (r.type === 'states') {
    const l = r.layer, g = l.gen;
    if (how) {
      const [x, y, w, h] = g.rect;
      Object.assign(l, { x, y, w, h, states: [g.closed, g.cands[revPick].src], state: 0, role: 'toggle' }); g.status = 'done';
    } else g.status = 'discarded';
  } else if (r.type === 'bg') {
    const g = scene.bgGen;
    if (how) { g.prev = scene.bg; scene.bg = g.cands[revPick].src; g.status = 'done'; } else delete scene.bgGen;
  } else {
    const e = r.entry;
    if (how) { e.done = applyAgent(e.result, e.job); e.status = 'done'; } else e.status = 'discarded';
  }
  commit(); renderAll(); renderAgentLog(); updReviewBtn();
  if (reviews().length) openReview(revIdx); else closeReview();
}

// ================= Scenes =================
$('sceneSel').onchange = async () => { await loadScene($('sceneSel').value); };
$('newScene').onclick = async () => {
  const n = prompt('新场景名（英文/数字/横线）', 'scene-' + Date.now().toString(36)); if (!n || !/^[\w\-.]+$/.test(n)) return;
  await loadScene(n); refreshScenes();
};
$('dupScene').onclick = async () => {
  const n = prompt('另存为（英文/数字/横线）', sceneName + '-v2'); if (!n || !/^[\w\-.]+$/.test(n)) return;
  sceneName = n; history.replaceState(null, '', '?scene=' + n); await save(); refreshScenes();
};

// ================= Boot =================
if (PLAYER) { document.body.classList.add('player'); document.title = "Chloe's Glow-Up"; }
if (PLAYER) {      // coming straight from the story the browser may already allow sound: then her first line needs no tap
  try { const c = new (window.AudioContext || window.webkitAudioContext)(); if (c.state === 'running') gestured = true; c.close(); } catch {}
}
fit(); loadLib(); loadScene(sceneName).then(refreshScenes).then(fit).then(() => PLAYER ? (setMode('play'), fit()) : hotRestore()).then(() => PLAYER || setInterval(hotCheck, 1500));      // players never get reloaded mid-game; each open loads the latest

// ================= Hot reload =================
// (editor.html and the scene file are polled every 1.5 s)
// The page watches its own file and the scene file. A new editor.html reloads the page; a scene changed from
// outside (by Claude) is swapped in place. Either way the mode, view, selection and play progress are kept.
let hotStamp = null;
const playProgress = () => mode === 'play' && P ? stepOrder().filter(l => P.done.has(l.id)).map(l => l.id) : null;
function restoreProgress(doneIds) {        // replay the finished steps instantly, in order
  startPlay(); if (!doneIds || !doneIds.length) return;
  P.instant = true; P.pre = null;
  for (const l of stepOrder()) if (doneIds.includes(l.id)) completeStep(l);
  P.instant = false; P.cv = {}; renderStage(); updHud();
}
async function hotCheck() {
  try {
    const h = await fetch('editor.html', { method: 'HEAD', cache: 'no-store' });
    const stamp = h.headers.get('Last-Modified') + '|' + h.headers.get('Content-Length');
    if (hotStamp && stamp !== hotStamp) {
      try { sessionStorage.setItem('hot', JSON.stringify({ mode, sel: selId, view: [S, VX, VY, userView], done: playProgress() })); } catch {}
      return location.reload();
    }
    hotStamp = stamp;
    if ($('saveState').textContent === '未保存…') return;       // own edit on its way: leave the scene alone
    const s = await api('api/scene?name=' + encodeURIComponent(sceneName));
    if (!s || (s.rev || 0) <= sceneRev) return;
    const done = playProgress(), sel = selId;
    scene = s; sceneRev = s.rev || 0; lastSnap = JSON.stringify(scene);
    await Promise.all(scene.layers.flatMap(l => l.states).map(measure));
    if (mode === 'play') restoreProgress(done); else { selectOnly(scene.layers.some(l => l.id === sel) ? sel : null); renderAll(); }
    $('saveState').textContent = '已同步最新场景';
  } catch {}
}
function hotRestore() {
  let h = null; try { h = JSON.parse(sessionStorage.getItem('hot')); sessionStorage.removeItem('hot'); } catch {}
  if (!h) return;
  if (h.view) { [S, VX, VY, userView] = h.view; applyView(); }
  if (h.sel && scene.layers.some(l => l.id === h.sel)) { selectOnly(h.sel); renderAll(); }
  if (h.mode === 'play') { setMode('play'); restoreProgress(h.done); }
  $('saveState').textContent = '已热更新';
}
window.__editor = { get scene() { return scene; }, get P() { return P; }, setMode, pickAsset };
